name: Publish to PyPI and Docker Hub

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build package
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: pypi
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Wait for PyPI availability
      run: |
        # Extract version safely with fallback
        VERSION=$(python3 << 'EOF'
        import re
        with open('src/cf_precheck/__init__.py', 'r') as f:
            content = f.read()
            match = re.search(r'__version__\s*=\s*["\']([^"\']+)["\']', content)
            if match:
                print(match.group(1))
            else:
                print("0.0.0")
                exit(1)
        EOF
        )
            echo "Waiting for cf-precheck==$VERSION on PyPI..."
            for i in $(seq 1 30); do
              if pip index versions cf-precheck 2>/dev/null | grep -q "$VERSION"; then
                echo "cf-precheck $VERSION is available on PyPI"
                break
              fi
              echo "Attempt $i/30 - not yet available, waiting 10s..."
              sleep 10
            done

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: dependencies
        push: true
        tags: chipfoundry/mpw_precheck:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
